apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-log-reader
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-log-reader
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-orchestrator
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: delta-platform-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-log-reader
