jenkins:
  systemMessage: "Delta 로컬 시험용 Jenkins"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: delta-api-token
              secret: ${DELTA_API_TOKEN}

jobs:
  - script: >
      pipelineJob('delta-demo-deploy') {
        description('스캔 → AI 판단 → 카나리 → 승격 또는 자동 롤백')
        definition {
          cps {
            script(new File('/pipelines/pipeline/Jenkinsfile').text)
            sandbox(true)
          }
        }
      }
