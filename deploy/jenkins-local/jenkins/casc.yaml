jenkins:
  systemMessage: "Delta 로컬 시험용 Jenkins"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: delta-api-token
              secret: ${DELTA_API_TOKEN}

jobs:
  - script: >
      pipelineJob('delta-demo-deploy') {
        description('스캔 → 사람 확인 → 카나리 → 승격 또는 자동 롤백')
        parameters {
          choiceParam('SCENARIO', ['good', 'vulnerable-code', 'failing-test', 'bad-canary', 'gate-down', 'low-traffic'], '시험할 상황')
          stringParam('RUN_ID', '', '파이프라인 실행 식별자. 재개할 때 같은 빌드를 찾는 데 쓴다')
        }
        // Jenkinsfile 의 options 는 재시작 후 첫 빌드가 돌아야 적용돼, 그 사이 빌드가 겹쳤다(#88·#89)
        properties {
          disableConcurrentBuilds()
        }
        definition {
          cps {
            script(new File('/pipelines/pipeline/Jenkinsfile').text)
            sandbox(true)
          }
        }
      }
