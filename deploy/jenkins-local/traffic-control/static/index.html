<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이전 트래픽 조절</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dfe3e8;
    --source: #6b7a8f; --target: #2f6fde; --ok: #1f8a4c; --warn: #b26a00; --bad: #c62f2f; --chip: #eef1f5;
    --focus: #2f6fde;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151a; --panel: #1a1e25; --text: #e7eaee; --muted: #9aa4b2; --line: #2c323c;
      --source: #8795a8; --target: #5b92f0; --ok: #4cc27f; --warn: #e3a54a; --bad: #f06767; --chip: #252b34;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; font-weight: 600; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); } .chip.info { color: var(--target); }
  .notice { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 16px; color: var(--muted); font-size: 13px; }
  .error { color: var(--bad); min-height: 1.5em; font-size: 13px; margin: 0 0 8px; }
  .cards { display: grid; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card h2 { font-size: 17px; margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card .path { color: var(--muted); font-weight: 400; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .label { width: 64px; color: var(--muted); font-size: 12px; flex: none; }
  .bar { flex: 1 1 260px; height: 22px; border-radius: 6px; overflow: hidden; display: flex; background: var(--chip); min-width: 0; }
  .bar span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; transition: width .3s; }
  .bar .s { background: var(--source); } .bar .t { background: var(--target); } .bar .x { background: var(--bad); }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  input[type=range] { flex: 1 1 200px; accent-color: var(--target); min-width: 0; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--text); cursor: pointer; }
  button.primary { background: var(--target); border-color: var(--target); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .value { font-variant-numeric: tabular-nums; width: 48px; text-align: right; font-weight: 600; }
  .detail { color: var(--muted); font-size: 13px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  section.log { margin-top: 20px; }
  section.log h2 { font-size: 15px; }
  .log-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; max-height: 320px; overflow: auto; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>이전 트래픽 조절</h1>
      <div class="meta" id="run">진행 중인 전환 없음</div>
    </div>
    <button id="finish" class="primary" hidden>전환 마침</button>
  </header>
  <div class="notice" id="mode-note">Jenkins 이전 파이프라인이 전환을 시작하면 여기서 서비스별 비율을 봅니다.</div>
  <p class="error" id="error" role="alert"></p>
  <div class="cards" id="cards"></div>
  <section class="log">
    <h2>기록</h2>
    <div class="log-wrap"><table><tbody id="events"></tbody></table></div>
  </section>
</main>
<script>
const NAMES = { aws: "AWS", gcp: "GCP" };
const STATES = {
  idle: ["대기", ""], source: ["출발 환경", ""], measuring: ["측정·판단 중", "info"], passed: ["통과", "ok"],
  needs_ack: ["사람 확인 필요", "warn"], rolled_back: ["되돌림", "bad"], completed: ["이전 완료", "ok"],
};
const PRESETS = [0, 10, 25, 50, 100];
let csrf = null;
let latest = null;
const drafts = {};  // 사용자가 움직인 슬라이더 값. 다음 갱신이 덮지 않게 한다

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, "");
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
};

async function call(path, body) {
  $("error").textContent = "";
  try {
    if (!csrf) csrf = (await (await fetch("/api/config")).json()).csrf_token;
    const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Control-Token": csrf },
                                         body: JSON.stringify(body || {}) });
    const data = await response.json();
    if (response.status === 401) csrf = null;  // 서버가 다시 떴다. 다음 호출에서 새로 받는다
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  } catch (error) {
    $("error").textContent = error.message;
    return null;
  } finally {
    refresh();
  }
}

function bar(parts) {
  const total = parts.reduce((sum, p) => sum + p.value, 0) || 1;
  return el("div", { class: "bar", role: "img", "aria-label": parts.map(p => `${p.name} ${Math.round(p.value / total * 100)}%`).join(", ") },
    ...parts.filter(p => p.value > 0).map(p => {
      const pct = p.value / total * 100;
      return el("span", { class: p.cls, style: `width:${pct}%` }, pct >= 12 ? `${p.name} ${Math.round(pct)}%` : "");
    }));
}

function card(service, run) {
  const source = run ? run.source : "aws", target = run ? run.target : "gcp";
  const [label, tone] = STATES[service.state] || [service.state, ""];
  const live = (latest.live || {})[service.id] || { clouds: {}, failed: 0, total: 0 };
  const manual = run && run.active && run.mode === "manual";
  const locked = ["measuring", "rolled_back", "needs_ack"].includes(service.state);
  const current = service.weights[target];
  const draft = drafts[service.id] ?? current;
  const targetUp = service.status[target] === "UP";

  const value = el("span", { class: "value" }, `${draft}%`);
  const slider = el("input", { type: "range", min: 0, max: 100, step: 5, value: draft, "aria-label": `${service.id} ${NAMES[target]} 비율`,
    disabled: !manual || locked,
    oninput: (e) => { drafts[service.id] = Number(e.target.value); value.textContent = `${e.target.value}%`; } });
  const apply = (percent) => { delete drafts[service.id]; call(`/api/services/${service.id}/weight`, { target_percent: percent }); };

  const controls = el("div", { class: "controls" },
    slider, value,
    el("button", { class: "primary", disabled: !manual || locked || draft === current || (draft > 0 && !targetUp),
                   onclick: () => apply(draft) }, "적용"),
    ...PRESETS.map(p => el("button", { disabled: !manual || locked || p === current || (p > 0 && !targetUp),
                                       onclick: () => apply(p) }, `${p}%`)),
    el("button", { class: "danger", disabled: !(run && run.active) || (current === 0 && service.state !== "measuring"),
                   onclick: () => call(`/api/services/${service.id}/rollback`, { reason: "화면에서 되돌림" }) }, `${NAMES[source]} 로 되돌리기`),
    service.state === "needs_ack" ? el("button", { onclick: () => call(`/api/services/${service.id}/ack`) }, "확인함") : "");

  const failed = live.failed;
  return el("div", { class: "card" },
    el("h2", {}, service.id, el("span", { class: "path" }, service.path), el("span", { class: `chip ${tone}` }, label),
       el("span", { class: `chip ${targetUp ? "ok" : "bad"}` }, `${NAMES[target]} 입구 ${service.status[target]}`)),
    el("div", { class: "row" }, el("span", { class: "label" }, "설정"),
       bar([{ name: NAMES[source], value: service.weights[source], cls: "s" }, { name: NAMES[target], value: service.weights[target], cls: "t" }])),
    el("div", { class: "row" }, el("span", { class: "label" }, "실제 응답"),
       live.total ? bar([{ name: NAMES[source], value: live.clouds[source] || 0, cls: "s" },
                         { name: NAMES[target], value: live.clouds[target] || 0, cls: "t" },
                         { name: "실패", value: failed, cls: "x" }]) : el("span", { class: "meta" }, "아직 응답 없음")),
    el("div", { class: "detail" }, `최근 10초 ${live.total}건, 실패 ${failed}건${service.detail ? " · " + service.detail : ""}`),
    controls);
}

function describe(event) {
  const t = new Date(event.at * 1000).toLocaleTimeString("ko-KR", { hour12: false });
  const who = event.actor === "ui" ? "화면" : "파이프라인";
  const text = {
    run_started: () => `전환 시작 (${event.mode}, ${NAMES[event.source]} → ${NAMES[event.target]})`,
    run_ended: () => `전환 끝: ${event.result}`,
    weight_set: () => `${event.service}: ${event.from}% → ${event.to}%`,
    rollback: () => `${event.service}: 되돌림 ${event.reason ? "(" + event.reason + ")" : ""}`,
    judged: () => `${event.service}: ${(STATES[event.state] || [event.state])[0]} @ ${event.percent}% ${event.detail || ""}`,
    ack: () => `${event.service}: 사람이 확인함`,
    finish: () => "전환 마침 요청",
  }[event.kind];
  return el("tr", {}, el("td", {}, t), el("td", {}, who), el("td", {}, text ? text() : event.kind));
}

function render() {
  const run = latest.run;
  const active = run && run.active;
  $("run").textContent = run
    ? `${run.run_id} · ${NAMES[run.source]} → ${NAMES[run.target]} · ${active ? (run.mode === "manual" ? "수동" : "자동") : "끝남 (" + run.result + ")"}`
    : "진행 중인 전환 없음";
  $("mode-note").textContent = !active ? "Jenkins 이전 파이프라인이 전환을 시작하면 여기서 서비스별 비율을 봅니다. 지금은 읽기 전용입니다."
    : run.mode === "manual" ? "수동 모드: 비율을 바꿀 때마다 파이프라인이 그 서비스만 지표를 재고 판단을 받습니다. 기준을 넘으면 그 서비스만 되돌립니다."
    : "자동 모드: 파이프라인이 정한 단계로 옮깁니다. 비율은 바꿀 수 없고, 되돌리기는 언제든 됩니다.";
  $("finish").hidden = !(active && run.mode === "manual");
  $("finish").disabled = !!(run && run.finish_requested);
  $("cards").replaceChildren(...latest.services.map(s => card(s, run)));
  $("events").replaceChildren(...[...latest.events].reverse().map(describe));
}

async function refresh() {
  try {
    const response = await fetch("/api/state");
    latest = await response.json();
    if (!response.ok) throw new Error(latest.error || `HTTP ${response.status}`);
    render();
  } catch (error) {
    $("error").textContent = `상태를 읽지 못했다: ${error.message}`;
  }
}

$("finish").addEventListener("click", () => call("/api/finish"));
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
