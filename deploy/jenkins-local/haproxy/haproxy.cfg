global
    # 런타임 API 는 compose 네트워크 안에서만 닿는다. 포트를 밖으로 열지 않는다.
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    timeout connect 2s
    timeout client 10s
    timeout server 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    hold nx 1s
    hold obsolete 1s

frontend public
    bind :80
    default_backend demo

backend demo
    balance roundrobin
    option httpchk GET /health
    default-server resolvers docker init-addr none check inter 1s fall 2 rise 1
    server blue demo-blue:8080 weight 100
    server green demo-green:8080 weight 0

# ---- 클라우드 이전 시험 (docs/ai-dlc/cloud-migration-pipeline.md) ----
# gateway 는 서비스마다 aws·gcp 두 입구로 나눈다. 가중치 합 100 이 곧 비율이다.
frontend migration
    bind :81
    use_backend mig_api if { path_beg /api/ }
    default_backend mig_web

backend mig_web
    balance roundrobin
    option httpchk GET /health
    default-server check inter 1s fall 2 rise 1
    server aws 127.0.0.1:8201 weight 100
    server gcp 127.0.0.1:8202 weight 0

backend mig_api
    balance roundrobin
    option httpchk GET /api/health
    default-server check inter 1s fall 2 rise 1
    server aws 127.0.0.1:8201 weight 100
    server gcp 127.0.0.1:8202 weight 0

# 클라우드 입구(ALB + AWS WAF, 부하 분산기 + Cloud Armor)의 대역. 실제 WAF 가 아니다.
# 차단 패턴은 파이프라인이 런타임 API(add acl)로 넣는다. 파일은 빈 채로 시작한다.
frontend edge_aws
    bind :8201
    http-request deny deny_status 403 if { url,url_dec -m reg -i -f /usr/local/etc/haproxy/waf/aws.acl }
    use_backend edge_aws_api if { path_beg /api/ }
    default_backend edge_aws_web

frontend edge_gcp
    bind :8202
    http-request deny deny_status 403 if { url,url_dec -m reg -i -f /usr/local/etc/haproxy/waf/gcp.acl }
    use_backend edge_gcp_api if { path_beg /api/ }
    default_backend edge_gcp_web

backend edge_aws_web
    default-server resolvers docker init-addr none check inter 1s fall 2 rise 1
    option httpchk GET /health
    server app mig-web-aws:8080

backend edge_aws_api
    default-server resolvers docker init-addr none check inter 1s fall 2 rise 1
    option httpchk GET /api/health
    server app mig-api-aws:8080

backend edge_gcp_web
    default-server resolvers docker init-addr none check inter 1s fall 2 rise 1
    option httpchk GET /health
    server app mig-web-gcp:8080

backend edge_gcp_api
    default-server resolvers docker init-addr none check inter 1s fall 2 rise 1
    option httpchk GET /api/health
    server app mig-api-gcp:8080
