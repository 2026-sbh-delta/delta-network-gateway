global
    # 런타임 API 는 compose 네트워크 안에서만 닿는다. 포트를 밖으로 열지 않는다.
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    timeout connect 2s
    timeout client 10s
    timeout server 10s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
    hold nx 1s
    hold obsolete 1s

frontend public
    bind :80
    default_backend demo

backend demo
    balance roundrobin
    option httpchk GET /health
    default-server resolvers docker init-addr none check inter 1s fall 2 rise 1
    server blue demo-blue:8080 weight 100
    server green demo-green:8080 weight 0
