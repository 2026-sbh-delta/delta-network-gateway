[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delta-staging"
version = "0.1.0"
description = "Delta 본선 스테이징 도구 — 관리 에이전트가 호출하면 이미지를 클라우드별 스테이징에 띄우고 내부 주소를 돌려준다"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "boto3>=1.35",
    "google-auth[requests]>=2.30",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["delta_staging"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
