[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delta-orchestrator"
version = "0.1.0"
description = "Delta 플랫폼 오케스트레이터(임시 메인 페이지: 서비스·스테이징·Jenkins·DAST 상태)"
requires-python = ">=3.12"
# delta-pipeline 은 같은 저장소의 services/delta-pipeline 에서 먼저 설치한다(Dockerfile 참고)
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "delta-pipeline"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.hatch.build.targets.wheel]
packages = ["delta_orchestrator"]
