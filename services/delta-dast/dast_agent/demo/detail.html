<article><h2>$post_title</h2><p class="meta">저장 번호 $post_id</p><div id="post-body">$body</div></article>
<section class="comments"><h3>댓글</h3><ul id="comment-list">$comments</ul>
<form method="post" action="/$scenario/posts/$post_id/comments"><label for="comment">댓글 쓰기</label><textarea id="comment" name="comment" rows="3" maxlength="8192" required></textarea>
<div class="toolbar"><button type="submit">댓글 등록</button></div></form></section>
<p><a href="/$scenario/board">목록으로 돌아가기</a></p>
