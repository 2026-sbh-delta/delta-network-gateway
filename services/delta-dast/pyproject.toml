[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dast-agent-local"
version = "0.1.0"
description = "격리된 로컬 게시판의 SAST 기반 저장형 XSS 검증"
requires-python = ">=3.12"
dependencies = [
  "google-auth[requests]>=2.40,<3",
  "fastapi>=0.162,<0.163",
  "uvicorn>=0.54,<0.55",
  "playwright>=1.64,<1.65",
  "pydantic>=2.14,<3",
  "claude-agent-sdk>=0.2.176,<0.3",
  "anthropic>=1,<2",
]

[tool.setuptools.packages.find]
include = ["dast_agent*"]

[tool.setuptools.package-data]
dast_agent = [
  "demo/*.html",
  "demo/*.css",
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "targets/*.json",
  "payloads/*.html",
]
