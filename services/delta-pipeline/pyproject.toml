[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delta-pipeline"
version = "0.1.0"
description = "Delta 본선 파이프라인 구동 — 온프레미스 증거·DAST·판단·Jenkins 배포"
requires-python = ">=3.12"
dependencies = [
    "delta-ai",
    "cryptography>=44",
    "langgraph==1.2.19",
    "langgraph-checkpoint-sqlite==3.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.hatch.build.targets.wheel]
packages = ["delta_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
