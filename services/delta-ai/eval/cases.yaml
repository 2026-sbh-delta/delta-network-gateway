# 평가셋 — base 픽스처에 patch 를 깊게 합쳐 돌린다. expect 는 허용 판정, rules 는 결과에 있어야 하는 규칙.
cases:
  - {name: waf-missing-attack-allowed, base: parity-waf-missing.json, expect: [fix], rules: [PAR-WAF-001, PAR-WAF-002]}
  - {name: equivalent-controls, base: parity-ok.json, expect: [pass]}
  - name: logging-unknown
    base: parity-ok.json
    patch: {target_env: {logging: {central: null}}}
    expect: [needs_human]
    rules: [PAR-LOG-001]
  - name: logging-off-is-fixable
    base: parity-ok.json
    patch: {target_env: {logging: {central: false}}}
    expect: [fix]
    rules: [PAR-LOG-001]
  - name: irsa-on-gke
    base: parity-ok.json
    patch: {target_env: {identity: {mechanism: irsa}}}
    expect: [needs_human]
    rules: [PAR-IAM-001]
  - name: s3-dependency
    base: parity-ok.json
    patch: {source_env: {identity: {cloud_apis: [s3]}}}
    expect: [needs_human]
    rules: [PAR-IAM-001]
  - name: plaintext-secret
    base: parity-ok.json
    patch: {target_env: {secrets: {plaintext_env: [DB_PASSWORD]}}}
    expect: [needs_human]
    rules: [PAR-SEC-001]
  - name: alert-only-is-not-blocked
    base: parity-ok.json
    patch: {evidence: {attack_results: [{scenario: sqli-login-bypass, environment: gcp, observed: alert_only}]}}
    expect: [needs_human]
    rules: [PAR-WAF-002]
  - name: waf-on-but-attack-passes
    base: parity-ok.json
    patch: {evidence: {attack_results: [{scenario: sqli-login-bypass, environment: gcp, observed: allowed, http_status: 200}]}}
    expect: [needs_human]
    rules: [PAR-WAF-002]
  - name: outside-inspection-path
    base: parity-ok.json
    patch: {target_env: {network: {inspected: false}}}
    expect: [needs_human]
    rules: [PAR-NET-001]
  - name: haproxy-gateway-same-result
    base: parity-ok.json
    patch: {source_env: {network: {gateway: haproxy}}, target_env: {network: {gateway: haproxy}}}
    expect: [pass]
  - {name: mapping-workload-server, base: mapping-workload-server.json, expect: [pass], rules: [MAP-CMP-001, MAP-CMP-002, MAP-OS-001, MAP-NET-001]}
  - name: mapping-guardduty-without-scc-tier
    base: mapping-workload-server.json
    patch: {evidence: {mapping: {security: {guardduty_enabled: true}}}}
    expect: [needs_human]
    rules: [MAP-SEC-001]
  # 파이프라인이 멈춘 단계의 원인 진단(deployment_gate). 판정은 파이프라인이 하고 여기서는 항상 사람 확인이다.
  - name: release-db-connectivity
    base: deployment-failed.json
    expect: [needs_human]
    rules: [DEP-STAGE-001]
  - name: staging-request-rejected
    base: deployment-failed.json
    patch: {evidence: {deployment: {stage: stage, target: gcp, log_tail: "스테이징 배포 실패 (#21 FAILURE) 스테이징 도구 422: 배포 요청 스키마·이미지 묶음·환경 변수 검증 실패"}}}
    expect: [needs_human]
    rules: [DEP-STAGE-001]
  - name: build-push-timeout
    base: deployment-failed.json
    patch: {evidence: {deployment: {stage: build, target: null, log_tail: "빌드 결과가 요청한 커밋·digest 와 맞지 않는다; docker push: request canceled while waiting for connection"}}}
    expect: [needs_human]
    rules: [DEP-STAGE-001]

