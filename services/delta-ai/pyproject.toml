[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delta-ai"
version = "0.1.0"
description = "Delta 본선 AI 판단 서비스 — 환경 차이·피드백 루프"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "anthropic>=1.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1", "pytest-cov>=7", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["delta_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
