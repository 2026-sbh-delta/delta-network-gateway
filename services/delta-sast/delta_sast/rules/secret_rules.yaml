# 비밀값 1단계(규칙) 판정 기준. 원문은 위치 표시 단계에서만 보고 특징만 남긴다.

# 값이 이 단어와 같거나(대소문자 무시) 이 단어로만 이뤄지면 자리표시 값으로 본다.
placeholders:
  - test
  - testing
  - dummy
  - fake
  - mock
  - sample
  - example
  - changeme
  - change_me
  - password
  - passwd
  - secret
  - token
  - apikey
  - api_key
  - admin
  - root
  - qwerty
  - letmein
  - foo
  - bar
  - foobar
  - todo
  - fixme
  - "none"
  - "null"
  - default
  - placeholder

# 값에 이 조각이 들어 있으면 자리표시 값으로 본다.
placeholder_fragments:
  - example
  - dummy
  - placeholder
  - your_
  - your-
  - "<"
  - "${"
  - "{{"
  - xxxx
  - "****"

# 공식 문서의 예시 키(실제 키 아님)
known_examples:
  - AKIAIOSFODNN7EXAMPLE
  - wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY

# 이 길이 미만이면 자리표시 값으로 본다.
min_length: 8

# 경로에 이 조각이 있으면 테스트·예시 위치로 본다.
test_paths:
  - /fixtures/
  - /fixture/
  - /examples/
  - /example/
  - /samples/
  - /sample/
  - /mocks/
  - /mock/
  - /docs/
  - .example
  - .sample
  - conftest.py

# 감싼 함수·클래스 이름에 이 조각이 있으면 테스트·예시 맥락으로 본다.
test_scopes:
  - test
  - mock
  - fake
  - dummy
  - fixture
  - example
  - sample
