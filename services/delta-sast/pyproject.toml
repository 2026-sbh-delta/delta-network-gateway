[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delta-sast"
version = "0.1.0"
description = "Delta 본선 SAST 도구 — Opengrep 위치 표시와 자체 AST 경로 추적으로 SARIF와 DAST 가설을 낸다"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "anthropic>=1.11",
    "claude-agent-sdk>=0.2.176,<0.3",
    "pydantic>=2.7,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["delta_sast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
