name: Platform infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan으로 검토 후 apply를 별도로 실행합니다.'
        required: true
        type: choice
        options: [plan, apply]
      plan_run_id:
        description: 'apply할 때 검토한 plan 실행의 run ID'
        type: string

permissions:
  contents: read

concurrency:
  group: platform-aws-mutation
  cancel-in-progress: false

jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.operation == 'apply' && 'platform-infra' || 'platform-plan' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      PLATFORM_TF_INPUTS: ${{ vars.PLATFORM_TF_INPUTS }}
      PLATFORM_STATE_BUCKET: ${{ vars.PLATFORM_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate CI configuration
        env:
          CI_ENABLED: ${{ vars.PLATFORM_CI_ENABLED }}
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          test "$CI_ENABLED" = true
          test -n "$ROLE_ARN"
          python3 platform/deploy/scripts/ci-config.py
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: platform-infra-${{ github.run_id }}
      - name: Initialize existing state
        working-directory: platform/deploy/terraform
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          terraform validate
      - name: Create reviewable plan
        if: inputs.operation == 'plan'
        working-directory: platform/deploy/terraform
        run: |
          terraform plan -lock-timeout=5m -out=reviewed.tfplan -no-color
          mkdir -p ../../.runtime/ci-plan
          cp reviewed.tfplan ../../.runtime/ci-plan/
          terraform show -no-color reviewed.tfplan > ../../.runtime/ci-plan/plan.txt
          printf '%s\n' "$GITHUB_SHA" > ../../.runtime/ci-plan/commit.txt
          cd ../../.runtime/ci-plan
          sha256sum reviewed.tfplan > SHA256SUMS
          printf '검토할 Plan run ID: `%s`\n\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.operation == 'plan'
        with:
          name: platform-plan
          path: platform/.runtime/ci-plan/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
      - name: Verify plan provenance
        if: inputs.operation == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 platform/deploy/scripts/verify-plan-run.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.operation == 'apply'
        with:
          name: platform-plan
          path: platform/.runtime/ci-plan
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}
      - name: Apply the reviewed plan
        if: inputs.operation == 'apply'
        working-directory: platform/deploy/terraform
        run: |
          test "$(cat ../../.runtime/ci-plan/commit.txt)" = "$GITHUB_SHA"
          (cd ../../.runtime/ci-plan && sha256sum -c SHA256SUMS)
          terraform apply -lock-timeout=5m -no-color ../../.runtime/ci-plan/reviewed.tfplan
