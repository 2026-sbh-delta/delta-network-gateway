name: Platform deployment worker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-deployment-worker-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Build trusted deployment worker
        run: docker build -f platform/deploy/workloads/agent/Dockerfile -t delta-deployer:release .
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: deployment-worker-${{ github.run_id }}
      - name: Publish immutable image
        shell: bash
        run: |
          set -euo pipefail
          test "$AWS_ACCOUNT_ID" = 616723161368
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          repository="$registry/delta-platform"
          tag="deployment-worker-$GITHUB_SHA"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker tag delta-deployer:release "$repository:$tag"
          docker push "$repository:$tag"
          digest="$(aws ecr describe-images --repository-name delta-platform --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)"
          echo "Deployment worker image: \`$repository@$digest\`" >> "$GITHUB_STEP_SUMMARY"
