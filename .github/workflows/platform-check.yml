name: Platform checks

on:
  pull_request:
    paths: ['platform/**', '.github/workflows/platform-*.yml']
  push:
    branches: [main, feat/platform]
    paths: ['platform/**', '.github/workflows/platform-*.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: platform_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.0'
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Backend
        working-directory: platform/backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - name: Deployment boundaries
        run: |
          python3 -m unittest discover -s platform/deploy/tests -v
          uv run --project platform/backend ruff check platform/deploy/scripts platform/deploy/tests
          uv run --project platform/backend ruff format --check platform/deploy/scripts platform/deploy/tests
      - name: Browser
        working-directory: platform/web
        run: |
          npm ci
          npm run format:check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
      - working-directory: platform/deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -lockfile=readonly
          terraform validate
          terraform test
