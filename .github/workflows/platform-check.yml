name: Platform checks

on:
  pull_request:
    paths: ['platform/**', 'services/delta-staging/**', 'services/delta-dast/**', 'services/delta-ai/**', '.github/workflows/platform-*.yml']
  push:
    branches: [main, feat/platform]
    paths: ['platform/**', 'services/delta-staging/**', 'services/delta-dast/**', 'services/delta-ai/**', '.github/workflows/platform-*.yml']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: platform_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: platform_test
        ports: ['55433:5432']
        options: >-
          --health-cmd "pg_isready -U platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.0'
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Backend
        working-directory: platform/backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - name: Staging library
        run: uv run --project platform/backend --with pytest-asyncio pytest -q -c services/delta-staging/pyproject.toml services/delta-staging/tests
      - name: Session example and OTel configuration
        env:
          DATABASE_URL: postgresql://platform_test:local-test-only@127.0.0.1:55433/platform_test
          APP_SECRET_KEY: isolated-ci-test-key-at-least-32-characters
          APP_SECURE_COOKIES: 'false'
          AWS_REGION: ap-northeast-2
          AWS_ACCESS_KEY_ID: validation-only
          AWS_SECRET_ACCESS_KEY: validation-only
          AWS_EC2_METADATA_DISABLED: 'true'
          DELTA_PROJECT_ID: 496562be-f67b-5f7e-a16b-929fd347b9ad
          DELTA_SERVICE_ID: 00000000-0000-0000-0000-000000000001
          DELTA_ENVIRONMENT_ID: 00000000-0000-0000-0000-000000000002
        run: |
          cd platform/examples/session-app
          uv run --frozen python manage.py test demo.notes --noinput
          cd ../../..
          docker run --rm -e AWS_REGION -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_EC2_METADATA_DISABLED -e DELTA_PROJECT_ID -e DELTA_SERVICE_ID -e DELTA_ENVIRONMENT_ID -v "$PWD/platform/observability/collector.yaml:/config.yaml:ro" otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b validate --config=/config.yaml
      - name: DAST platform contract
        run: uv run --project services/delta-dast --python 3.12 --frozen --with pytest --with pytest-asyncio --with httpx python -m pytest -q services/delta-dast/tests/test_platform_api.py services/delta-dast/tests/test_sarif_adapter.py services/delta-dast/tests/test_llm_runtime.py
      - name: Platform to team DAST integration
        working-directory: platform/backend
        run: uv run --with-editable ../../services/delta-dast pytest -q tests/integration_dast.py
      - name: AI execution identity
        run: uv run --project services/delta-ai --python 3.12 --frozen --extra dev pytest -q services/delta-ai/tests
      - name: Platform to team AI integration
        working-directory: platform/backend
        run: uv run --with-editable ../../services/delta-ai pytest -q tests/integration_assessments.py
      - name: Deployment boundaries
        run: |
          python3 -m unittest discover -s platform/deploy/tests -v
          uv run --project platform/backend ruff check platform/deploy/scripts platform/deploy/tests platform/deploy/builds platform/deploy/sandbox platform/deploy/jenkins platform/deploy/sast/aws platform/deploy/dast
          uv run --project platform/backend ruff format --check platform/deploy/scripts platform/deploy/tests platform/deploy/builds platform/deploy/sandbox platform/deploy/jenkins platform/deploy/sast/aws platform/deploy/dast
      - name: Browser
        working-directory: platform/web
        run: |
          npm ci
          npm run format:check
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: PostgreSQL copy and cutover
        run: |
          trap 'docker compose -f platform/migration/compose.test.yaml down -v' EXIT
          uv run --project platform/backend ruff check --config platform/backend/pyproject.toml platform/migration
          uv run --project platform/backend ruff format --check --config platform/backend/pyproject.toml platform/migration
          docker compose -f platform/migration/compose.test.yaml build test
          docker compose -f platform/migration/compose.test.yaml run --rm test
      - name: Fullstack session continuity
        run: |
          trap 'docker compose --env-file platform/.runtime/migration-demo/.env -f platform/migration/compose.demo.yaml --profile target-app --profile runner down -v' EXIT
          uv run --project platform/backend python platform/migration/demo.py
  terraform:
    strategy:
      fail-fast: false
      matrix:
        root: [platform/deploy/terraform, platform/deploy/identity, platform/deploy/builds, platform/deploy/sandbox, platform/deploy/jenkins/identity, platform/deploy/sast/network, platform/deploy/observability/identity]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
      - working-directory: ${{ matrix.root }}
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -lockfile=readonly
          terraform validate
          terraform test
