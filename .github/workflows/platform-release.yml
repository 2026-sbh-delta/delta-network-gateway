name: Platform release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-aws-mutation
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/platform-check.yml
  deploy:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PLATFORM_TF_INPUTS: ${{ vars.PLATFORM_TF_INPUTS }}
      PLATFORM_STATE_BUCKET: ${{ vars.PLATFORM_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      POSTGRES_IMAGE: ${{ vars.PLATFORM_POSTGRES_IMAGE }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate CI configuration
        env:
          CI_ENABLED: ${{ vars.PLATFORM_CI_ENABLED }}
          ROLE_ARN: ${{ env.AWS_ROLE_ARN }}
        run: |
          test "$CI_ENABLED" = true
          test -n "$ROLE_ARN"
          test -n "$POSTGRES_IMAGE"
          python3 platform/deploy/scripts/ci-config.py
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.0'
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
          terraform_wrapper: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM64 runtime
        run: docker buildx build --platform linux/arm64 --load -t delta-platform:release -f platform/Dockerfile .
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: platform-release-${{ github.run_id }}
      - name: Read current infrastructure outputs
        working-directory: platform/deploy/terraform
        run: |
          terraform init -backend-config=backend.hcl -lockfile=readonly
          mkdir -p ../../.runtime
          terraform output -json > ../../.runtime/aws-outputs.json
      - name: Publish and deploy immutable images
        run: |
          uv sync --project platform/deploy --frozen
          uv run --project platform/deploy python platform/deploy/scripts/publish-images.py --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION" --image delta-platform:release --postgres-image "$POSTGRES_IMAGE" --output platform/.runtime/published-images.json
          uv run --project platform/deploy python platform/deploy/scripts/deploy-release.py --outputs platform/.runtime/aws-outputs.json --images platform/.runtime/published-images.json --runtime-dir platform/.runtime --existing-runtime
      - name: Check HTTPS readiness
        run: |
          python3 platform/deploy/scripts/check-release.py platform/.runtime/aws-outputs.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-release-${{ github.sha }}
          path: |
            platform/.runtime/published-images.json
            platform/.runtime/deployment-command.json
            platform/.runtime/deployment-status.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
