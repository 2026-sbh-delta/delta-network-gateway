<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delta 메모</title><style>body{font-family:system-ui;background:#f3f6fa;color:#173049;max-width:760px;margin:5vh auto;padding:24px}main{padding:32px;border-radius:16px;background:white}input{width:70%;padding:12px}button{padding:12px;background:#174bd1;color:white;border:0;border-radius:8px}li{padding:14px;border-bottom:1px solid #eee}small{color:#64748b}.badge{background:#def2e8;padding:8px 14px;border-radius:20px;display:inline-block}</style><main><span class="badge">실행 환경: {{ environment }}</span><h1>{{ user.username }}님의 메모</h1><p>같은 주소와 로그인으로 이전 후에도 계속 사용합니다.</p><form method="post">{% csrf_token %}<input name="text" maxlength="160" required placeholder="이전 전후 보존할 메모"><button>저장</button></form><ul>{% for note in notes %}<li>{{ note.text }} <small>{{ note.created_at }}</small></li>{% empty %}<li>첫 메모를 작성하세요.</li>{% endfor %}</ul><form action="/logout/" method="post">{% csrf_token %}<button>로그아웃</button></form><p><small>버전: {{ version }}</small></p></main></html>
