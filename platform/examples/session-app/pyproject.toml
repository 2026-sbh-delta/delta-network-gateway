[project]
name = "delta-session-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3", "gunicorn>=23,<26", "psycopg[binary]>=3.2,<4",
  "opentelemetry-sdk>=1.38,<2", "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "opentelemetry-instrumentation-django>=0.59b0,<1",
  "opentelemetry-instrumentation-psycopg>=0.59b0,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]
