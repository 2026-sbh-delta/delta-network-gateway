schema_version: 1
provider: onprem
node_name: delta-onprem
architecture: amd64
private_ip: 10.40.0.10
namespaces:
  sandbox: delta-platform-sandbox
  runtime: delta-notes
build:
  provider: jenkins
  frontend_context: frontend
  backend_context: backend
