apiVersion: v1
kind: Namespace
metadata:
  name: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - create
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - pods
  - services
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: delta-notes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scanner
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
rules:
- apiGroups:
  - ''
  - apps
  resources:
  - pods
  - services
  - deployments
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scanner
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scanner
subjects:
- kind: ServiceAccount
  name: scanner
  namespace: delta-notes
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runtime
  namespace: delta-notes
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  hard:
    pods: '5'
    requests.cpu: 1500m
    limits.cpu: 2500m
    requests.memory: 1536Mi
    limits.memory: 2Gi
    persistentvolumeclaims: '1'
    requests.storage: 2Gi
