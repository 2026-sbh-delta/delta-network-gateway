# 고정 Service와 통신 정책. 승인된 주소는 render.py가 주입합니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  podSelector:
    matchLabels:
      app: delta-platform-sandbox
  policyTypes:
  - Ingress
  - Egress
  egress: []
  ingress:
  - from:
    - ipBlock:
        cidr: 10.80.1.70/32
    - ipBlock:
        cidr: 10.90.10.83/32
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: delta-platform-sandbox
  ports:
  - name: http
    port: 80
    targetPort: http
    nodePort: 32080
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-backend
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  selector:
    app: delta-platform-sandbox-backend
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-deny
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  podSelector:
    matchLabels:
      app: delta-platform-sandbox-backend
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-backend
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  podSelector:
    matchLabels:
      app: delta-platform-sandbox
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: delta-platform-sandbox-backend
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-frontend
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  podSelector:
    matchLabels:
      app: delta-platform-sandbox-backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: delta-platform-sandbox
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: delta-platform-sandbox
  labels:
    app.kubernetes.io/managed-by: delta-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
