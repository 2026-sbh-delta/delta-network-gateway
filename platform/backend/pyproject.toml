[project]
name = "delta-platform"
version = "0.1.0"
description = "개발자용 멀티 클라우드 플랫폼 API와 Worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "delta-staging", "httpx>=0.28,<1", "argon2-cffi>=23.1,<26", "boto3>=1.40,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[project.scripts]
platform-api = "delta_platform.api.app:main"
platform-worker = "delta_platform.worker.main:main"
platform-init = "delta_platform.config:initialize"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: 실제 GitHub API를 사용하는 별도 검사"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.uv.sources]
delta-staging = { path = "../../services/delta-staging" }
