name: delta-platform-u1-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform_test
      POSTGRES_DB: platform_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_test -d platform_test"]
      interval: 2s
      timeout: 3s
      retries: 20
